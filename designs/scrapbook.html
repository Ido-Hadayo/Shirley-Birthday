<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אופציה ב׳ — אלבום תמונות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF2E3;
    --card:#FFFDF8;
    --ink:#3A2A1E;
    --ink-muted:#9C8770;
    --pink:#E2738C;
    --mint:#6FB6A0;
    --mustard:#D98C2B;
    --line:#E9DAC2;
  }
  /* פסטל אנלוגי (משפחת אדום-כתום-חול, הפרשי גוון קטנים) */
  :root[data-palette="analogous"]{
    --pink:#E8A7A0; --mint:#EFC7A0; --mustard:#D9C39A;
  }
  /* מונוכרום שלווה (ירוק-מרווה בגוני עומק, נגיעת ורוד עמום כמשלים) */
  :root[data-palette="monochrome"]{
    --pink:#6E8F6B; --mint:#A8C7A0; --mustard:#D98C93;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(rgba(58,42,30,0.05) 1px, transparent 1px);
    background-size:18px 18px;
    color:var(--ink);
    font-family:"Assistant","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;} }
  .page{ width:100%; max-width:460px; direction:rtl; }
  .tape{
    display:block;
    width:120px;
    height:26px;
    margin:0 auto 6px;
    background:repeating-linear-gradient(45deg, var(--mustard) 0 6px, #E8B25E 6px 12px);
    opacity:.85;
    transform:rotate(-2deg);
    border-radius:2px;
  }
  h1{
    font-family:"Suez One",serif;
    font-size:2.1rem;
    text-align:center;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .sub{ text-align:center; color:var(--ink-muted); font-size:.9rem; margin:0 0 18px; }

  .palette-row{ display:flex; gap:8px; justify-content:center; margin:0 0 22px; flex-wrap:wrap; }
  .palette-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; cursor:pointer; font-family:"Assistant",sans-serif; font-size:.74rem; color:var(--ink-muted);
  }
  .palette-btn.active{ border-color:var(--mustard); color:var(--ink); }
  .palette-dots{ display:flex; gap:2px; }
  .palette-dots span{ width:9px; height:9px; border-radius:50%; }

  .polaroid-now{
    background:var(--card);
    border-radius:4px;
    padding:14px 14px 20px;
    box-shadow:0 14px 30px -12px rgba(58,42,30,0.35);
    transform:rotate(-1.2deg);
    margin-bottom:28px;
  }
  .now-art{
    aspect-ratio:1/1;
    border-radius:2px;
    background:linear-gradient(150deg,var(--pink),var(--mint));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    margin-bottom:12px;
  }
  .now-art img{ width:100%; height:100%; object-fit:cover; }
  .now-art svg{ width:48px; height:48px; fill:#fff; opacity:.9; }
  .now-kind{ font-size:.78rem; color:var(--pink); font-weight:700; text-align:center; margin-bottom:2px; }
  .now-title{ font-family:"Suez One",serif; font-size:1.3rem; text-align:center; margin-bottom:2px; }
  .now-sub{ font-size:.82rem; color:var(--ink-muted); text-align:center; min-height:1.1em; }
  .status{ font-size:.78rem; color:var(--pink); text-align:center; margin-top:6px; }

  .time-row{
    display:flex; align-items:center; gap:8px; direction:ltr;
    font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
    font-size:.72rem; color:var(--ink-muted); margin:14px 2px 4px;
  }
  input[type=range]{ flex:1; -webkit-appearance:none; height:4px; border-radius:4px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--mustard); cursor:pointer; border:2px solid var(--card); }

  .controls{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:6px; }
  .btn{ background:none; border:none; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .btn-side{ width:40px; height:40px; }
  .btn-side svg{ width:20px; height:20px; fill:var(--ink-muted); }
  .btn-play{
    width:58px; height:58px; border-radius:50%;
    background:var(--pink); color:#fff;
    box-shadow:0 8px 18px -6px rgba(226,115,140,.7);
  }
  .btn-play svg{ width:22px; height:22px; fill:#fff; }

  .grid-heading{ font-family:"Suez One",serif; font-size:1.1rem; margin:8px 4px 12px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .pola{
    background:var(--card);
    border-radius:3px;
    padding:8px 8px 30px;
    box-shadow:0 8px 18px -10px rgba(58,42,30,.4);
    cursor:pointer;
    text-align:right;
    border:none;
    font-family:inherit;
    color:inherit;
    position:relative;
  }
  .pola:nth-child(3n+1){ transform:rotate(-2deg); }
  .pola:nth-child(3n+2){ transform:rotate(1.5deg); }
  .pola:nth-child(3n){ transform:rotate(-1deg); }
  .pola.active{ outline:2px solid var(--mustard); outline-offset:2px; }
  .pola-art{
    aspect-ratio:1/1; border-radius:2px; overflow:hidden;
    background:linear-gradient(150deg,var(--pink),var(--mint));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:8px;
  }
  .pola-art img{ width:100%; height:100%; object-fit:cover; }
  .pola-art svg{ width:22px; height:22px; fill:#fff; opacity:.9; }
  .pola-num{ position:absolute; top:6px; left:8px; font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-muted); }
  .pola-from{ font-size:.72rem; color:var(--pink); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pola-song{ font-size:.8rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .back{ display:block; text-align:center; margin-top:30px; color:var(--ink-muted); font-size:.82rem; }
</style>
</head>
<body>
<div class="page">
  <span class="tape"></span>
  <h1>יום הולדת שמח, שירלי!</h1>
  <p class="sub">אלבום ההקדשות שלך</p>

  <div class="palette-row" id="paletteRow"></div>

  <div class="polaroid-now">
    <div class="now-art" id="art"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg></div>
    <p class="now-kind" id="kind">הקלטה</p>
    <p class="now-title" id="title">טוען…</p>
    <p class="now-sub" id="sub"></p>
    <p class="status" id="status"></p>

    <div class="time-row">
      <span id="tCurrent">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      <span id="tTotal">0:00</span>
    </div>
    <div class="controls">
      <button class="btn btn-side" id="prevBtn" aria-label="הקודם"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="btn btn-play" id="playBtn" aria-label="נגן"><svg viewBox="0 0 24 24"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <button class="btn btn-side" id="nextBtn" aria-label="הבא"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    </div>
  </div>

  <p class="grid-heading">כל התמונות באלבום</p>
  <div class="grid" id="list"></div>

  <a class="back" href="./index.html">← לכל האופציות</a>
</div>

<audio id="audio"></audio>

<script>
const PALETTES = [
  { id: "default", label: "מקורי", dots: ["#E2738C","#6FB6A0","#D98C2B"] },
  { id: "analogous", label: "פסטל אנלוגי", dots: ["#E8A7A0","#EFC7A0","#D9C39A"] },
  { id: "monochrome", label: "מונוכרום שלווה", dots: ["#6E8F6B","#A8C7A0","#D98C93"] },
];
function applyPalette(id){
  document.documentElement.setAttribute("data-palette", id === "default" ? "" : id);
  try{ localStorage.setItem("palette-scrapbook", id); }catch(e){}
  document.querySelectorAll(".palette-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
}
function renderPaletteRow(){
  const row = document.getElementById("paletteRow");
  let saved = "default";
  try{ saved = localStorage.getItem("palette-scrapbook") || "default"; }catch(e){}
  PALETTES.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "palette-btn" + (p.id === saved ? " active" : "");
    btn.dataset.id = p.id;
    btn.innerHTML = `<span class="palette-dots">${p.dots.map(c=>`<span style="background:${c}"></span>`).join("")}</span>${p.label}`;
    btn.addEventListener("click", () => applyPalette(p.id));
    row.appendChild(btn);
  });
  applyPalette(saved);
}
renderPaletteRow();

const RAW_BASE = "https://raw.githubusercontent.com/Ido-Hadayo/Shirley-Birthday/main/";
const audioUrl = f => f ? RAW_BASE + "audio/" + f : "";
const coverUrl = f => f ? RAW_BASE + "covers/" + f : "";

const PAIRS_RAW = [
  { from: "סימונה", recording: "", song: { title: "Forever Young — Alphaville", file: "01-forever-young.mp3", cover: "" } },
  { from: "משה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "מעיין", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "עמית", recording: "", song: { title: "טיפת אמת — רביד פלוטניק", file: "02-tipat-emet.mp3", cover: "" } },
  { from: "נוי", recording: "", song: { title: "שיר לנטע — ניר כנען", file: "03-shir-lenatta.mp3", cover: "" } },
  { from: "אמית", recording: "", song: { title: "איך לאכול אותך?", file: "04-eich-leechol-otach.mp3", cover: "" } },
  { from: "יובל", recording: "", song: { title: "It Starts With Sorry", file: "05-it-starts-with-sorry.mp3", cover: "" } },
  { from: "דרור", recording: "", song: { title: "עבד כי ימלוך", file: "06-eved-ki-yimloch.mp3", cover: "" } },
  { from: "מוניס", recording: "", song: { title: "עבריין — ליילי", file: "07-avaryan.mp3", cover: "" } },
  { from: "גבי", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "יויו", recording: "", song: { title: "משהו שהוא שלך", file: "", cover: "" } },
  { from: "אבא שלה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "דניאל", recording: "", song: { title: "וודו — מרסדס בנד", file: "08-vudu.mp3", cover: "" } },
  { from: "לי ים", recording: "", song: { title: "Don't Stop Me Now — Queen", file: "09-dont-stop-me-now.mp3", cover: "" } },
  { from: "נווה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "גל", recording: "", song: { title: "לונדון", file: "", cover: "" } },
  { from: "רז", recording: "", song: { title: "", file: "", cover: "" } },
];

const PAIRS = PAIRS_RAW.map(p => ({
  from: p.from,
  recording: audioUrl(p.recording),
  song: { title: p.song.title, src: audioUrl(p.song.file), cover: coverUrl(p.song.cover) }
}));
const PLAYLIST = PAIRS.flatMap((p, pi) => [
  { type: "recording", src: p.recording, from: p.from, pairIndex: pi },
  { type: "song", src: p.song.src, title: p.song.title, cover: p.song.cover, from: p.from, pairIndex: pi }
]);

const audio = document.getElementById("audio");
const art = document.getElementById("art");
const kindEl = document.getElementById("kind");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const seek = document.getElementById("seek");
const tCurrent = document.getElementById("tCurrent");
const tTotal = document.getElementById("tTotal");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const listEl = document.getElementById("list");

const ICON_MIC = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3z"/></svg>';

let current = 0, isSeeking = false;
function fmt(s){ if(!isFinite(s)) return "0:00"; const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,"0"); return `${m}:${sec}`; }

function renderList(){
  listEl.innerHTML = "";
  PAIRS.forEach((p, i) => {
    const el = document.createElement("button");
    const isActive = PLAYLIST[current].pairIndex === i;
    el.className = "pola" + (isActive ? " active" : "");
    el.innerHTML = `
      <span class="pola-num">${String(i+1).padStart(2,"0")}</span>
      <span class="pola-art">${p.song.cover ? `<img src="${p.song.cover}" alt="">` : ICON_NOTE}</span>
      <span class="pola-from">מאת ${p.from}</span>
      <span class="pola-song">${p.song.title || "השיר טרם נבחר"}</span>`;
    el.addEventListener("click", () => loadTrack(i*2, true));
    listEl.appendChild(el);
  });
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= PLAYLIST.length) return;
  current = i;
  const t = PLAYLIST[i];
  statusEl.textContent = "";
  audio.src = t.src || "";
  if(t.type === "recording"){
    kindEl.textContent = "הקלטה";
    titleEl.textContent = `הקדשה מאת ${t.from}`;
    subEl.textContent = "";
    art.innerHTML = ICON_MIC;
  } else {
    kindEl.textContent = "שיר";
    titleEl.textContent = t.title || "השיר טרם נבחר";
    subEl.textContent = `מוקדש ע"י ${t.from}`;
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_NOTE;
  }
  renderList();
  if(autoplay){
    if(!t.src){ statusEl.textContent = "מדלג — הקובץ הזה עוד לא הועלה"; loadTrack(i+1, true); return; }
    audio.play().catch(()=>{});
  }
}

playBtn.addEventListener("click", () => {
  if(!audio.src){ loadTrack(current+1, true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
});
prevBtn.addEventListener("click", () => loadTrack(current-1, true));
nextBtn.addEventListener("click", () => loadTrack(current+1, true));
audio.addEventListener("play", () => document.getElementById("playIcon").setAttribute("d","M6 5h4v14H6zm8 0h4v14h-4z"));
audio.addEventListener("pause", () => document.getElementById("playIcon").setAttribute("d","M8 5v14l11-7z"));
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration || 0; tTotal.textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => { if(isSeeking) return; seek.value = audio.currentTime; tCurrent.textContent = fmt(audio.currentTime); });
seek.addEventListener("input", () => isSeeking = true);
seek.addEventListener("change", () => { if(audio.src) audio.currentTime = parseFloat(seek.value); isSeeking = false; });
audio.addEventListener("ended", () => { if(current < PLAYLIST.length-1) loadTrack(current+1, true); });
audio.addEventListener("error", () => { if(audio.src) statusEl.textContent = "לא הצלחתי לטעון את הקובץ הזה"; });

loadTrack(0, false);
</script>
</body>
</html>
