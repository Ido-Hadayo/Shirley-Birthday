<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אופציה ד׳ — כרטיס קונפטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7FB;
    --card:#FFFFFF;
    --ink:#2B2140;
    --ink-muted:#8078A0;
    --purple:#8B5CF6;
    --yellow:#FFC93C;
    --teal:#2EC4B6;
    --pink:#FF6FA5;
    --line:#F0E7FA;
  }
  /* פסטל אחיד (אותה טטרדה, רוויה ובהירות עדינות יותר) */
  :root[data-palette="pastel"]{
    --purple:#B9A6F0; --yellow:#FFE29A; --teal:#9FE0D3; --pink:#FFB8CE;
  }
  /* דו-גוני חגיגי (סגול מול זהב בלבד, פחות תחרות צבעים) */
  :root[data-palette="duotone"]{
    --purple:#7C6FEF; --yellow:#E8B84B; --teal:#7C6FEF; --pink:#E8B84B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Heebo","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
    padding:28px 16px 64px;
    position:relative;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;} }
  .confetti{ position:absolute; border-radius:3px; opacity:.7; }
  .page{ width:100%; max-width:440px; direction:rtl; position:relative; z-index:1; }

  h1{ font-family:"Varela Round",sans-serif; font-size:1.9rem; text-align:center; margin:0 0 4px; text-wrap:balance; color:var(--purple); }
  .sub{ text-align:center; color:var(--ink-muted); font-size:.9rem; margin:0 0 18px; }

  .palette-row{ display:flex; gap:8px; justify-content:center; margin:0 0 24px; flex-wrap:wrap; }
  .palette-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; cursor:pointer; font-family:"Heebo",sans-serif; font-size:.74rem; color:var(--ink-muted);
    box-shadow:0 4px 10px -6px rgba(43,33,64,.2);
  }
  .palette-btn.active{ border-color:var(--purple); color:var(--ink); }
  .palette-dots{ display:flex; gap:2px; }
  .palette-dots span{ width:9px; height:9px; border-radius:50%; }

  .badge-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .badge{
    width:168px; height:168px; border-radius:50%;
    background:var(--card);
    border:6px solid var(--yellow);
    box-shadow:0 16px 30px -14px rgba(139,92,246,.35);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .badge img{ width:100%; height:100%; object-fit:cover; }
  .badge svg{ width:56px; height:56px; fill:var(--purple); }

  .kind{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); text-align:center; margin:14px 0 4px; }
  .title{ font-family:"Varela Round",sans-serif; font-size:1.3rem; text-align:center; margin:0 0 2px; text-wrap:balance; }
  .subtitle{ font-size:.85rem; color:var(--ink-muted); text-align:center; min-height:1.2em; }
  .status{ font-size:.78rem; color:var(--pink); text-align:center; margin-top:6px; }

  .time-row{ display:flex; align-items:center; gap:8px; direction:ltr; font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums; font-size:.72rem; color:var(--ink-muted); margin:18px 4px 8px; }
  input[type=range]{ flex:1; -webkit-appearance:none; height:6px; border-radius:6px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--purple); cursor:pointer; box-shadow:0 2px 6px rgba(139,92,246,.5); }

  .controls{ display:flex; align-items:center; justify-content:center; gap:20px; margin:6px 0 30px; }
  .btn{ background:none; border:none; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .btn-side{ width:46px; height:46px; border-radius:50%; background:var(--card); box-shadow:0 6px 14px -8px rgba(43,33,64,.25); }
  .btn-side svg{ width:18px; height:18px; fill:var(--ink-muted); }
  .btn-play{ width:64px; height:64px; border-radius:50%; background:var(--purple); box-shadow:0 10px 20px -8px rgba(139,92,246,.6); }
  .btn-play svg{ width:24px; height:24px; fill:#fff; }

  .chips-heading{ font-family:"Varela Round",sans-serif; font-size:1.05rem; text-align:center; margin:0 0 14px; color:var(--purple); }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .chip{
    border:none; cursor:pointer; border-radius:999px; padding:10px 16px;
    font-family:"Heebo",sans-serif; font-size:.85rem; color:#fff;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 14px -8px rgba(43,33,64,.3);
  }
  .chip .thumb{ width:22px; height:22px; border-radius:50%; overflow:hidden; background:rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chip .thumb img{ width:100%; height:100%; object-fit:cover; }
  .chip .thumb svg{ width:12px; height:12px; fill:#fff; }
  .chip.active{ outline:3px solid var(--ink); outline-offset:1px; }

  .back{ display:block; text-align:center; margin-top:30px; color:var(--ink-muted); font-size:.82rem; }
</style>
</head>
<body>
<span class="confetti" style="width:14px;height:14px;background:var(--yellow);top:6%;left:8%;transform:rotate(18deg);"></span>
<span class="confetti" style="width:10px;height:10px;background:var(--teal);top:14%;right:10%;transform:rotate(-12deg);"></span>
<span class="confetti" style="width:16px;height:16px;background:var(--pink);top:38%;left:4%;transform:rotate(8deg);border-radius:50%;"></span>
<span class="confetti" style="width:12px;height:12px;background:var(--purple);top:60%;right:6%;transform:rotate(30deg);"></span>
<span class="confetti" style="width:10px;height:10px;background:var(--yellow);top:80%;left:10%;transform:rotate(-20deg);border-radius:50%;"></span>
<span class="confetti" style="width:14px;height:14px;background:var(--teal);top:92%;right:14%;transform:rotate(15deg);"></span>
<div class="page">
  <h1>יום הולדת שמח, שירלי! 🎉</h1>
  <p class="sub">כרטיס ברכה עם 17 הקדשות</p>

  <div class="palette-row" id="paletteRow"></div>

  <div class="badge-wrap">
    <div class="badge" id="art"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg></div>
  </div>
  <p class="kind" id="kind">הקלטה</p>
  <p class="title" id="title">טוען…</p>
  <p class="subtitle" id="sub"></p>
  <p class="status" id="status"></p>

  <div class="time-row">
    <span id="tCurrent">0:00</span>
    <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
    <span id="tTotal">0:00</span>
  </div>
  <div class="controls">
    <button class="btn btn-side" id="prevBtn" aria-label="הקודם"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="btn btn-play" id="playBtn" aria-label="נגן"><svg viewBox="0 0 24 24"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
    <button class="btn btn-side" id="nextBtn" aria-label="הבא"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
  </div>

  <p class="chips-heading">כל ההקדשות</p>
  <div class="chips" id="list"></div>

  <a class="back" href="./index.html">← לכל האופציות</a>
</div>

<audio id="audio"></audio>

<script>
const PALETTES = [
  { id: "default", label: "מקורי", dots: ["#8B5CF6","#FFC93C","#2EC4B6","#FF6FA5"] },
  { id: "pastel", label: "פסטל אחיד", dots: ["#B9A6F0","#FFE29A","#9FE0D3","#FFB8CE"] },
  { id: "duotone", label: "דו-גוני חגיגי", dots: ["#7C6FEF","#E8B84B"] },
];
function applyPalette(id){
  document.documentElement.setAttribute("data-palette", id === "default" ? "" : id);
  try{ localStorage.setItem("palette-confetti", id); }catch(e){}
  document.querySelectorAll(".palette-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
}
function renderPaletteRow(){
  const row = document.getElementById("paletteRow");
  let saved = "default";
  try{ saved = localStorage.getItem("palette-confetti") || "default"; }catch(e){}
  PALETTES.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "palette-btn" + (p.id === saved ? " active" : "");
    btn.dataset.id = p.id;
    btn.innerHTML = `<span class="palette-dots">${p.dots.map(c=>`<span style="background:${c}"></span>`).join("")}</span>${p.label}`;
    btn.addEventListener("click", () => applyPalette(p.id));
    row.appendChild(btn);
  });
  applyPalette(saved);
}
renderPaletteRow();

const RAW_BASE = "https://raw.githubusercontent.com/Ido-Hadayo/Shirley-Birthday/main/";
const audioUrl = f => f ? RAW_BASE + "audio/" + f : "";
const coverUrl = f => f ? RAW_BASE + "covers/" + f : "";
const CHIP_COLORS = ["#8B5CF6","#FF6FA5","#2EC4B6","#FFC93C"];

const PAIRS_RAW = [
  { from: "סימונה", recording: "", song: { title: "Forever Young — Alphaville", file: "01-forever-young.mp3", cover: "" } },
  { from: "משה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "מעיין", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "עמית", recording: "", song: { title: "טיפת אמת — רביד פלוטניק", file: "02-tipat-emet.mp3", cover: "" } },
  { from: "נוי", recording: "", song: { title: "שיר לנטע — ניר כנען", file: "03-shir-lenatta.mp3", cover: "" } },
  { from: "אמית", recording: "", song: { title: "איך לאכול אותך?", file: "04-eich-leechol-otach.mp3", cover: "" } },
  { from: "יובל", recording: "", song: { title: "It Starts With Sorry", file: "05-it-starts-with-sorry.mp3", cover: "" } },
  { from: "דרור", recording: "", song: { title: "עבד כי ימלוך", file: "06-eved-ki-yimloch.mp3", cover: "" } },
  { from: "מוניס", recording: "", song: { title: "עבריין — ליילי", file: "07-avaryan.mp3", cover: "" } },
  { from: "גבי", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "יויו", recording: "", song: { title: "משהו שהוא שלך", file: "", cover: "" } },
  { from: "אבא שלה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "דניאל", recording: "", song: { title: "וודו — מרסדס בנד", file: "08-vudu.mp3", cover: "" } },
  { from: "לי ים", recording: "", song: { title: "Don't Stop Me Now — Queen", file: "09-dont-stop-me-now.mp3", cover: "" } },
  { from: "נווה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "גל", recording: "", song: { title: "לונדון", file: "", cover: "" } },
  { from: "רז", recording: "", song: { title: "", file: "", cover: "" } },
];

const PAIRS = PAIRS_RAW.map(p => ({
  from: p.from,
  recording: audioUrl(p.recording),
  song: { title: p.song.title, src: audioUrl(p.song.file), cover: coverUrl(p.song.cover) }
}));
const PLAYLIST = PAIRS.flatMap((p, pi) => [
  { type: "recording", src: p.recording, from: p.from, pairIndex: pi },
  { type: "song", src: p.song.src, title: p.song.title, cover: p.song.cover, from: p.from, pairIndex: pi }
]);

const audio = document.getElementById("audio");
const art = document.getElementById("art");
const kindEl = document.getElementById("kind");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const seek = document.getElementById("seek");
const tCurrent = document.getElementById("tCurrent");
const tTotal = document.getElementById("tTotal");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const listEl = document.getElementById("list");

const ICON_MIC = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3z"/></svg>';

let current = 0, isSeeking = false;
function fmt(s){ if(!isFinite(s)) return "0:00"; const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,"0"); return `${m}:${sec}`; }

function renderList(){
  listEl.innerHTML = "";
  PAIRS.forEach((p, i) => {
    const el = document.createElement("button");
    const isActive = PLAYLIST[current].pairIndex === i;
    el.className = "chip" + (isActive ? " active" : "");
    el.style.background = CHIP_COLORS[i % CHIP_COLORS.length];
    el.innerHTML = `
      <span class="thumb">${p.song.cover ? `<img src="${p.song.cover}" alt="">` : ICON_NOTE}</span>
      <span>${p.from}${p.song.title ? " · " + p.song.title : ""}</span>`;
    el.addEventListener("click", () => loadTrack(i*2, true));
    listEl.appendChild(el);
  });
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= PLAYLIST.length) return;
  current = i;
  const t = PLAYLIST[i];
  statusEl.textContent = "";
  audio.src = t.src || "";
  if(t.type === "recording"){
    kindEl.textContent = "הקלטה";
    titleEl.textContent = `הקדשה מאת ${t.from}`;
    subEl.textContent = "";
    art.innerHTML = ICON_MIC;
  } else {
    kindEl.textContent = "שיר";
    titleEl.textContent = t.title || "השיר טרם נבחר";
    subEl.textContent = `מוקדש ע"י ${t.from}`;
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_NOTE;
  }
  renderList();
  if(autoplay){
    if(!t.src){ statusEl.textContent = "מדלג — הקובץ הזה עוד לא הועלה"; loadTrack(i+1, true); return; }
    audio.play().catch(()=>{});
  }
}

playBtn.addEventListener("click", () => {
  if(!audio.src){ loadTrack(current+1, true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
});
prevBtn.addEventListener("click", () => loadTrack(current-1, true));
nextBtn.addEventListener("click", () => loadTrack(current+1, true));
audio.addEventListener("play", () => document.getElementById("playIcon").setAttribute("d","M6 5h4v14H6zm8 0h4v14h-4z"));
audio.addEventListener("pause", () => document.getElementById("playIcon").setAttribute("d","M8 5v14l11-7z"));
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration || 0; tTotal.textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => { if(isSeeking) return; seek.value = audio.currentTime; tCurrent.textContent = fmt(audio.currentTime); });
seek.addEventListener("input", () => isSeeking = true);
seek.addEventListener("change", () => { if(audio.src) audio.currentTime = parseFloat(seek.value); isSeeking = false; });
audio.addEventListener("ended", () => { if(current < PLAYLIST.length-1) loadTrack(current+1, true); });
audio.addEventListener("error", () => { if(audio.src) statusEl.textContent = "לא הצלחתי לטעון את הקובץ הזה"; });

loadTrack(0, false);
</script>
</body>
</html>
