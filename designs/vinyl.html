<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אופציה ג׳ — תקליט לילה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B14;
    --card:rgba(255,255,255,0.045);
    --line:rgba(255,255,255,0.09);
    --ink:#F3F2FF;
    --ink-muted:#8B8BAE;
    --pink:#FF3D8A;
    --cyan:#33F0D6;
    --purple:#9B5CFF;
  }
  /* טריאדי עמוק (אותה מבנה זוויות, גוונים עשירים פחות זוהרים) */
  :root[data-palette="triadic"]{
    --pink:#D6398F; --cyan:#2FBF8F; --purple:#5B5FEF;
  }
  /* מונוכרום כחול-סגול (גוון אחד, גוני בהירות שונים) */
  :root[data-palette="monochrome"]{
    --pink:#6B7FF5; --cyan:#A6B0FF; --purple:#33409E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(155,92,255,0.18), transparent 55%),
      radial-gradient(circle at 90% 20%, rgba(51,240,214,0.12), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:"Heebo","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
    padding:28px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;} }
  .page{ width:100%; max-width:460px; direction:rtl; }
  .eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); text-align:center; margin:0 0 6px; }
  h1{ font-family:"Secular One",sans-serif; font-size:1.9rem; text-align:center; margin:0 0 24px; text-wrap:balance;
      background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .palette-row{ display:flex; gap:8px; justify-content:center; margin:0 0 20px; flex-wrap:wrap; }
  .palette-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; cursor:pointer; font-family:"Heebo",sans-serif; font-size:.74rem; color:var(--ink-muted);
  }
  .palette-btn.active{ border-color:var(--cyan); color:var(--ink); }
  .palette-dots{ display:flex; gap:2px; }
  .palette-dots span{ width:9px; height:9px; border-radius:50%; }

  .scroller{ display:flex; gap:12px; overflow-x:auto; padding:4px 4px 16px; margin-bottom:8px; }
  .scroller::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; width:56px; height:56px; border-radius:50%;
    background:linear-gradient(160deg,var(--pink),var(--purple));
    border:2px solid transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; position:relative;
  }
  .chip img{ width:100%; height:100%; object-fit:cover; }
  .chip svg{ width:20px; height:20px; fill:#fff; opacity:.9; }
  .chip.active{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(51,240,214,.25); }

  .deck{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 20px 22px;
    backdrop-filter:blur(8px);
    text-align:center;
  }
  .disc-wrap{ display:flex; justify-content:center; margin-bottom:18px; }
  .disc{
    width:190px; height:190px; border-radius:50%; position:relative;
    background:
      repeating-radial-gradient(circle, #14141f 0 3px, #1c1c2a 3px 6px);
    box-shadow:0 0 0 1px var(--line), 0 20px 40px -18px rgba(0,0,0,.7);
    display:flex; align-items:center; justify-content:center;
  }
  body.playing .disc{ animation:spin 6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .label{
    width:78px; height:78px; border-radius:50%; overflow:hidden;
    background:linear-gradient(160deg,var(--pink),var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 4px #0B0B14;
  }
  .label img{ width:100%; height:100%; object-fit:cover; }
  .label svg{ width:28px; height:28px; fill:#fff; }

  .kind{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--pink); margin:0 0 4px; }
  .title{ font-family:"Secular One",sans-serif; font-size:1.25rem; margin:0 0 2px; text-wrap:balance; }
  .subtitle{ font-size:.82rem; color:var(--ink-muted); min-height:1.2em; margin:0; }
  .status{ font-size:.78rem; color:var(--cyan); margin-top:6px; }

  .time-row{ display:flex; align-items:center; gap:8px; direction:ltr; font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums; font-size:.72rem; color:var(--ink-muted); margin:18px 2px 8px; }
  input[type=range]{ flex:1; -webkit-appearance:none; height:3px; border-radius:3px;
    background:linear-gradient(90deg,var(--pink),var(--cyan)); opacity:.35; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--cyan); cursor:pointer; box-shadow:0 0 8px var(--cyan); }

  .controls{ display:flex; align-items:center; justify-content:center; gap:20px; margin-top:4px; }
  .btn{ background:none; border:none; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .btn-side{ width:42px; height:42px; }
  .btn-side svg{ width:18px; height:18px; fill:var(--ink-muted); }
  .btn-play{ width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple)); box-shadow:0 0 22px rgba(255,61,138,.45); }
  .btn-play svg{ width:22px; height:22px; fill:#fff; }

  .back{ display:block; text-align:center; margin-top:26px; color:var(--ink-muted); font-size:.82rem; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">NIGHT MIX · שירלי</p>
  <h1>יום הולדת שמח!</h1>

  <div class="palette-row" id="paletteRow"></div>

  <div class="scroller" id="scroller"></div>

  <div class="deck">
    <div class="disc-wrap">
      <div class="disc"><div class="label" id="art"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg></div></div>
    </div>
    <p class="kind" id="kind">הקלטה</p>
    <p class="title" id="title">טוען…</p>
    <p class="subtitle" id="sub"></p>
    <p class="status" id="status"></p>

    <div class="time-row">
      <span id="tCurrent">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      <span id="tTotal">0:00</span>
    </div>
    <div class="controls">
      <button class="btn btn-side" id="prevBtn" aria-label="הקודם"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="btn btn-play" id="playBtn" aria-label="נגן"><svg viewBox="0 0 24 24"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <button class="btn btn-side" id="nextBtn" aria-label="הבא"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    </div>
  </div>

  <a class="back" href="./index.html">← לכל האופציות</a>
</div>

<audio id="audio"></audio>

<script>
const PALETTES = [
  { id: "default", label: "מקורי", dots: ["#FF3D8A","#33F0D6","#9B5CFF"] },
  { id: "triadic", label: "טריאדי עמוק", dots: ["#D6398F","#2FBF8F","#5B5FEF"] },
  { id: "monochrome", label: "מונוכרום כחול", dots: ["#6B7FF5","#A6B0FF","#33409E"] },
];
function applyPalette(id){
  document.documentElement.setAttribute("data-palette", id === "default" ? "" : id);
  try{ localStorage.setItem("palette-vinyl", id); }catch(e){}
  document.querySelectorAll(".palette-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
}
function renderPaletteRow(){
  const row = document.getElementById("paletteRow");
  let saved = "default";
  try{ saved = localStorage.getItem("palette-vinyl") || "default"; }catch(e){}
  PALETTES.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "palette-btn" + (p.id === saved ? " active" : "");
    btn.dataset.id = p.id;
    btn.innerHTML = `<span class="palette-dots">${p.dots.map(c=>`<span style="background:${c}"></span>`).join("")}</span>${p.label}`;
    btn.addEventListener("click", () => applyPalette(p.id));
    row.appendChild(btn);
  });
  applyPalette(saved);
}
renderPaletteRow();

const RAW_BASE = "https://raw.githubusercontent.com/Ido-Hadayo/Shirley-Birthday/main/";
const audioUrl = f => f ? RAW_BASE + "audio/" + f : "";
const coverUrl = f => f ? RAW_BASE + "covers/" + f : "";

const PAIRS_RAW = [
  { from: "סימונה", recording: "", song: { title: "Forever Young — Alphaville", file: "01-forever-young.mp3", cover: "" } },
  { from: "משה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "מעיין", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "עמית", recording: "", song: { title: "טיפת אמת — רביד פלוטניק", file: "02-tipat-emet.mp3", cover: "" } },
  { from: "נוי", recording: "", song: { title: "שיר לנטע — ניר כנען", file: "03-shir-lenatta.mp3", cover: "" } },
  { from: "אמית", recording: "", song: { title: "איך לאכול אותך?", file: "04-eich-leechol-otach.mp3", cover: "" } },
  { from: "יובל", recording: "", song: { title: "It Starts With Sorry", file: "05-it-starts-with-sorry.mp3", cover: "" } },
  { from: "דרור", recording: "", song: { title: "עבד כי ימלוך", file: "06-eved-ki-yimloch.mp3", cover: "" } },
  { from: "מוניס", recording: "", song: { title: "עבריין — ליילי", file: "07-avaryan.mp3", cover: "" } },
  { from: "גבי", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "יויו", recording: "", song: { title: "משהו שהוא שלך", file: "", cover: "" } },
  { from: "אבא שלה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "דניאל", recording: "", song: { title: "וודו — מרסדס בנד", file: "08-vudu.mp3", cover: "" } },
  { from: "לי ים", recording: "", song: { title: "Don't Stop Me Now — Queen", file: "09-dont-stop-me-now.mp3", cover: "" } },
  { from: "נווה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "גל", recording: "", song: { title: "לונדון", file: "", cover: "" } },
  { from: "רז", recording: "", song: { title: "", file: "", cover: "" } },
];

const PAIRS = PAIRS_RAW.map(p => ({
  from: p.from,
  recording: audioUrl(p.recording),
  song: { title: p.song.title, src: audioUrl(p.song.file), cover: coverUrl(p.song.cover) }
}));
const PLAYLIST = PAIRS.flatMap((p, pi) => [
  { type: "recording", src: p.recording, from: p.from, pairIndex: pi },
  { type: "song", src: p.song.src, title: p.song.title, cover: p.song.cover, from: p.from, pairIndex: pi }
]);

const audio = document.getElementById("audio");
const art = document.getElementById("art");
const kindEl = document.getElementById("kind");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const seek = document.getElementById("seek");
const tCurrent = document.getElementById("tCurrent");
const tTotal = document.getElementById("tTotal");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const scrollerEl = document.getElementById("scroller");

const ICON_MIC = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3z"/></svg>';

let current = 0, isSeeking = false;
function fmt(s){ if(!isFinite(s)) return "0:00"; const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,"0"); return `${m}:${sec}`; }

function renderScroller(){
  scrollerEl.innerHTML = "";
  PAIRS.forEach((p, i) => {
    const el = document.createElement("button");
    const isActive = PLAYLIST[current].pairIndex === i;
    el.className = "chip" + (isActive ? " active" : "");
    el.title = `${p.from} — ${p.song.title || "השיר טרם נבחר"}`;
    el.innerHTML = p.song.cover ? `<img src="${p.song.cover}" alt="">` : ICON_NOTE;
    el.addEventListener("click", () => loadTrack(i*2, true));
    scrollerEl.appendChild(el);
  });
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= PLAYLIST.length) return;
  current = i;
  const t = PLAYLIST[i];
  statusEl.textContent = "";
  audio.src = t.src || "";
  if(t.type === "recording"){
    kindEl.textContent = "הקלטה";
    titleEl.textContent = `הקדשה מאת ${t.from}`;
    subEl.textContent = "";
    art.innerHTML = ICON_MIC;
  } else {
    kindEl.textContent = "שיר";
    titleEl.textContent = t.title || "השיר טרם נבחר";
    subEl.textContent = `מוקדש ע"י ${t.from}`;
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_NOTE;
  }
  renderScroller();
  if(autoplay){
    if(!t.src){ statusEl.textContent = "מדלג — הקובץ הזה עוד לא הועלה"; loadTrack(i+1, true); return; }
    audio.play().catch(()=>{});
  }
}

playBtn.addEventListener("click", () => {
  if(!audio.src){ loadTrack(current+1, true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
});
prevBtn.addEventListener("click", () => loadTrack(current-1, true));
nextBtn.addEventListener("click", () => loadTrack(current+1, true));
audio.addEventListener("play", () => { document.getElementById("playIcon").setAttribute("d","M6 5h4v14H6zm8 0h4v14h-4z"); document.body.classList.add("playing"); });
audio.addEventListener("pause", () => { document.getElementById("playIcon").setAttribute("d","M8 5v14l11-7z"); document.body.classList.remove("playing"); });
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration || 0; tTotal.textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => { if(isSeeking) return; seek.value = audio.currentTime; tCurrent.textContent = fmt(audio.currentTime); });
seek.addEventListener("input", () => isSeeking = true);
seek.addEventListener("change", () => { if(audio.src) audio.currentTime = parseFloat(seek.value); isSeeking = false; });
audio.addEventListener("ended", () => { if(current < PLAYLIST.length-1) loadTrack(current+1, true); });
audio.addEventListener("error", () => { if(audio.src) statusEl.textContent = "לא הצלחתי לטעון את הקובץ הזה"; });

loadTrack(0, false);
</script>
</body>
</html>
