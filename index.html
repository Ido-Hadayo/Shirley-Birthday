<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מיקסטייפ יום הולדת לשירלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17111f;
    --bg-raised:#241a30;
    --bg-well:#0f0a17;
    --ink:#f3ead9;
    --ink-muted:#b1a0bd;
    --amber:#e7a53c;
    --amber-dim:#8a6423;
    --rose:#e2637f;
    --teal:#4fb3ab;
    --line:rgba(243,234,217,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Rubik","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
  .page{
    width:100%;
    max-width:420px;
    direction:rtl;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.18em;
    color:var(--amber);
    text-transform:uppercase;
    text-align:center;
    margin:0 0 6px;
  }
  h1{
    font-family:"Frank Ruhl Libre",Georgia,serif;
    font-weight:900;
    font-size:2rem;
    text-align:center;
    margin:0 0 28px;
    text-wrap:balance;
    line-height:1.25;
  }

  .deck{
    background:var(--bg-raised);
    border-radius:20px;
    padding:18px 18px 22px;
    border:1px solid var(--line);
    box-shadow:0 24px 48px -20px rgba(0,0,0,0.6);
  }

  /* cassette */
  .cassette{
    background:var(--bg-well);
    border-radius:12px;
    padding:16px 20px;
    border:1px solid var(--line);
    margin-bottom:16px;
  }
  .reels{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 14px;
  }
  .reel{
    width:46px;
    height:46px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, var(--bg-well) 0 6px, transparent 6.5px),
      repeating-conic-gradient(var(--amber-dim) 0deg 15deg, transparent 15deg 30deg);
    border:2px solid var(--amber-dim);
    position:relative;
  }
  .reel::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--bg-well);
    margin:16px;
  }
  body.playing .reel{
    animation:spin 3s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .tape-strip{
    flex:1;
    height:2px;
    background:var(--amber-dim);
    margin:0 10px 14px;
  }
  .label{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:56px;
  }
  .label-art{
    width:56px;
    height:56px;
    border-radius:8px;
    flex-shrink:0;
    background:linear-gradient(160deg,var(--rose),var(--teal));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .label-art img{ width:100%; height:100%; object-fit:cover; }
  .label-art svg{ width:26px; height:26px; }
  .label-text{ min-width:0; flex:1; }
  .label-kind{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0 0 2px;
  }
  .label-kind.rec{ color:var(--rose); }
  .label-kind.song{ color:var(--teal); }
  .label-title{
    font-weight:600;
    font-size:1.05rem;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .label-sub{
    font-size:0.82rem;
    color:var(--ink-muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .status-note{
    font-size:0.78rem;
    color:var(--ink-muted);
    text-align:center;
    margin-top:10px;
  }

  .counter-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:0.78rem;
    color:var(--ink-muted);
    margin:16px 2px 10px;
  }
  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:3px;
    border-radius:3px;
    background:var(--line);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .btn{
    background:var(--bg-well);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .btn-side{ width:44px; height:44px; }
  .btn-side svg{ width:16px; height:16px; fill:var(--ink-muted); }
  .btn-play{
    width:60px; height:60px;
    background:var(--amber);
    border-color:var(--amber);
  }
  .btn-play svg{ width:20px; height:20px; fill:var(--bg-well); }

  .tracklist{
    margin-top:22px;
    display:flex;
    flex-direction:column;
  }
  .tracklist-heading{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    padding:0 4px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .pair-row{
    display:flex;
    align-items:stretch;
    gap:12px;
    padding:10px 4px 10px 8px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    background:none;
    border-left:none;
    border-right:3px solid var(--amber-dim);
    border-top:none;
    width:100%;
    text-align:right;
    font-family:inherit;
    color:inherit;
  }
  .pair-row:last-child{ border-bottom:none; }
  .pair-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.78rem;
    color:var(--ink-muted);
    width:20px;
    flex-shrink:0;
    padding-top:1px;
  }
  .pair-info{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .pair-from{
    font-size:0.8rem;
    color:var(--rose);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pair-from b{ color:var(--ink); font-weight:600; }
  .pair-song{
    font-weight:500;
    font-size:0.94rem;
    color:var(--teal);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pair-row.active{ border-right-color:var(--amber); background:rgba(231,165,60,0.06); }
  .pair-row.active .pair-num{ color:var(--amber); }

  .example-flag{
    display:inline-block;
    margin-top:18px;
    padding:8px 12px;
    border-radius:8px;
    background:rgba(231,165,60,0.12);
    border:1px solid rgba(231,165,60,0.35);
    color:var(--amber);
    font-size:0.78rem;
    text-align:center;
    width:100%;
  }
</style>
</head>
<body>

<div class="page" dir="rtl">
  <p class="eyebrow">מיקסטייפ מוקלט ביד</p>
  <h1>יום הולדת שמח, שירלי!</h1>

  <div class="deck">
    <div class="cassette">
      <div class="reels">
        <div class="reel"></div>
        <div class="tape-strip"></div>
        <div class="reel"></div>
      </div>
      <div class="label">
        <div class="label-art" id="art">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>
        </div>
        <div class="label-text">
          <p class="label-kind" id="kind">הקלטה</p>
          <p class="label-title" id="title">טוען…</p>
          <p class="label-sub" id="sub"></p>
        </div>
      </div>
      <p class="status-note" id="status"></p>
    </div>

    <div class="counter-row">
      <span id="tCurrent">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      <span id="tTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="btn btn-side" id="prevBtn" aria-label="הקטע הקודם">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn" aria-label="נגן או עצור">
        <svg viewBox="0 0 24 24"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn btn-side" id="nextBtn" aria-label="הקטע הבא">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <div class="tracklist">
      <p class="tracklist-heading">סדר ההשמעה</p>
      <div id="list"></div>
    </div>
  </div>

  <span class="example-flag" id="exampleFlag" hidden>הקבצים כאן הם עדיין דוגמה — יוחלפו בהקלטות ובשירים האמיתיים</span>
</div>

<audio id="audio"></audio>

<script>
/*
  הקבצים עצמם יושבים ברפו נפרד (Ido-Hadayo/Shirley-Birthday), בתיקיות
  audio/ ו-covers/, ונטענים כאן דרך raw.githubusercontent.com.
  כל איבר הוא זוג "הקלטה + שיר מוקדש", לפי סדר ההשמעה.
  from:  שם מי שהקליט את ההקדשה
  recording: שם קובץ ה-mp3 של ההקלטה בתוך audio/ (ריק = עדיין לא הועלה)
  song.title / song.file / song.cover: פרטי השיר שמוקדש בעקבותיה
    (song.file בתוך audio/, song.cover בתוך covers/)
*/
const RAW_BASE = "https://raw.githubusercontent.com/Ido-Hadayo/Shirley-Birthday/main/";
const audioUrl = f => f ? RAW_BASE + "audio/" + f : "";
const coverUrl = f => f ? RAW_BASE + "covers/" + f : "";

const PAIRS_RAW = [
  { from: "סימונה", recording: "", song: { title: "Forever Young — Alphaville", file: "01-forever-young.mp3", cover: "" } },
  { from: "משה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "מעיין", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "עמית", recording: "", song: { title: "טיפת אמת — רביד פלוטניק", file: "02-tipat-emet.mp3", cover: "" } },
  { from: "נוי", recording: "", song: { title: "שיר לנטע — ניר כנען", file: "03-shir-lenatta.mp3", cover: "" } },
  { from: "אמית", recording: "", song: { title: "איך לאכול אותך?", file: "04-eich-leechol-otach.mp3", cover: "" } },
  { from: "יובל", recording: "", song: { title: "It Starts With Sorry", file: "05-it-starts-with-sorry.mp3", cover: "" } },
  { from: "דרור", recording: "", song: { title: "עבד כי ימלוך", file: "06-eved-ki-yimloch.mp3", cover: "" } },
  { from: "מוניס", recording: "", song: { title: "עבריין — ליילי", file: "07-avaryan.mp3", cover: "" } },
  { from: "גבי", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "יויו", recording: "", song: { title: "משהו שהוא שלך", file: "", cover: "" } },
  { from: "אבא שלה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "דניאל", recording: "", song: { title: "וודו — מרסדס בנד", file: "08-vudu.mp3", cover: "" } },
  { from: "לי ים", recording: "", song: { title: "Don't Stop Me Now — Queen", file: "09-dont-stop-me-now.mp3", cover: "" } },
  { from: "נווה", recording: "", song: { title: "", file: "", cover: "" } },
  { from: "גל", recording: "", song: { title: "לונדון", file: "", cover: "" } },
  { from: "רז", recording: "", song: { title: "", file: "", cover: "" } },
];

const PAIRS = PAIRS_RAW.map(p => ({
  from: p.from,
  recording: audioUrl(p.recording),
  song: { title: p.song.title, src: audioUrl(p.song.file), cover: coverUrl(p.song.cover) }
}));

const PLAYLIST = PAIRS.flatMap((p, pi) => [
  { type: "recording", src: p.recording, from: p.from, pairIndex: pi },
  { type: "song", src: p.song.src, title: p.song.title, cover: p.song.cover, from: p.from, pairIndex: pi }
]);

const hasRealFiles = PAIRS.some(p => p.recording || p.song.src);
document.getElementById("exampleFlag").hidden = hasRealFiles;

const audio = document.getElementById("audio");
const art = document.getElementById("art");
const kindEl = document.getElementById("kind");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const seek = document.getElementById("seek");
const tCurrent = document.getElementById("tCurrent");
const tTotal = document.getElementById("tTotal");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const listEl = document.getElementById("list");

const ICON_MIC = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3z"/></svg>';

let current = 0;
let isSeeking = false;

function fmt(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function renderList(){
  listEl.innerHTML = "";
  PAIRS.forEach((p, i) => {
    const row = document.createElement("button");
    const isActive = PLAYLIST[current].pairIndex === i;
    row.className = "pair-row" + (isActive ? " active" : "");
    row.innerHTML = `
      <span class="pair-num">${String(i+1).padStart(2,"0")}</span>
      <span class="pair-info">
        <span class="pair-from">🎙️ הקדשה מאת <b>${p.from}</b></span>
        <span class="pair-song">🎵 ${p.song.title || "השיר טרם נבחר"}</span>
      </span>`;
    row.addEventListener("click", () => loadTrack(i*2, true));
    listEl.appendChild(row);
  });
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= PLAYLIST.length) return;
  current = i;
  const t = PLAYLIST[i];
  statusEl.textContent = "";
  audio.src = t.src || "";

  if(t.type === "recording"){
    kindEl.textContent = "הקלטה";
    kindEl.className = "label-kind rec";
    titleEl.textContent = `הקדשה מאת ${t.from}`;
    subEl.textContent = "";
    art.innerHTML = ICON_MIC;
  } else {
    kindEl.textContent = "שיר";
    kindEl.className = "label-kind song";
    titleEl.textContent = t.title || "השיר טרם נבחר";
    subEl.textContent = `מוקדש ע"י ${t.from}`;
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_NOTE;
  }

  renderList();
  if(autoplay){
    if(!t.src){
      statusEl.textContent = "מדלג — הקובץ הזה עוד לא הועלה";
      loadTrack(i + 1, true);
      return;
    }
    audio.play().catch(()=>{});
  }
}

playBtn.addEventListener("click", () => {
  if(!audio.src){ loadTrack(current + 1, true); return; }
  if(audio.paused){ audio.play().catch(()=>{}); }
  else { audio.pause(); }
});

prevBtn.addEventListener("click", () => loadTrack(current - 1, true));
nextBtn.addEventListener("click", () => loadTrack(current + 1, true));

audio.addEventListener("play", () => { document.getElementById("playIcon").setAttribute("d", "M6 5h4v14H6zm8 0h4v14h-4z"); document.body.classList.add("playing"); });
audio.addEventListener("pause", () => { document.getElementById("playIcon").setAttribute("d", "M8 5v14l11-7z"); document.body.classList.remove("playing"); });

audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration || 0;
  tTotal.textContent = fmt(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  if(isSeeking) return;
  seek.value = audio.currentTime;
  tCurrent.textContent = fmt(audio.currentTime);
});

seek.addEventListener("input", () => { isSeeking = true; });
seek.addEventListener("change", () => {
  if(audio.src) audio.currentTime = parseFloat(seek.value);
  isSeeking = false;
});

audio.addEventListener("ended", () => {
  if(current < PLAYLIST.length - 1) loadTrack(current + 1, true);
});

audio.addEventListener("error", () => {
  if(audio.src) statusEl.textContent = "לא הצלחתי לטעון את הקובץ הזה";
});

loadTrack(0, false);
</script>
</body>
</html>
