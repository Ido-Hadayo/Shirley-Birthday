<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מיקסטייפ יום הולדת לשירלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0;
    --bg-raised:#FFFFFF;
    --bg-well:#F2EAD9;
    --ink:#2A2118;
    --ink-muted:#8A7B6B;
    --amber:#C9871F;
    --amber-dim:#D9C39A;
    --rose:#C4436A;
    --teal:#238C82;
    --line:rgba(42,33,24,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Heebo","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
  .page{
    width:100%;
    max-width:420px;
    direction:rtl;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.18em;
    color:var(--amber);
    text-transform:uppercase;
    text-align:center;
    margin:0 0 6px;
  }
  h1{
    font-family:"Heebo","Segoe UI",Arial,sans-serif;
    font-weight:800;
    font-size:1.9rem;
    text-align:center;
    margin:0 0 16px;
    text-wrap:balance;
    line-height:1.25;
  }

  .deck{
    background:var(--bg-raised);
    border-radius:20px;
    padding:18px 18px 22px;
    border:1px solid var(--line);
    box-shadow:0 24px 48px -20px rgba(0,0,0,0.6);
  }

  /* now playing — משבצת קטנה + טקסט בצד */
  .now-playing{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:16px;
    box-shadow:0 4px 14px -8px rgba(42,33,24,0.18);
  }
  .now-art{
    width:56px;
    height:56px;
    flex-shrink:0;
    border-radius:10px;
    background:linear-gradient(160deg,var(--rose),var(--teal));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 8px 16px -8px rgba(42,33,24,0.4);
  }
  .now-art img{ width:100%; height:100%; object-fit:cover; }
  .now-art svg{ width:24px; height:24px; fill:#fff; opacity:.95; }
  .now-info{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .now-kind{
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    font-weight:600;
  }
  .now-kind.rec{ color:var(--rose); }
  .now-kind.song{ color:var(--teal); }
  .now-title{
    font-weight:700;
    font-size:1rem;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .now-sub{
    font-size:0.82rem;
    color:var(--ink-muted);
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .status-note{
    font-size:0.78rem;
    color:var(--ink-muted);
    text-align:center;
    margin-top:8px;
  }

  .counter-row{
    display:flex;
    align-items:center;
    gap:10px;
    direction:ltr;
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:0.78rem;
    color:var(--ink-muted);
    margin:16px 2px 10px;
  }
  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:3px;
    border-radius:3px;
    background:var(--line);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .btn{
    background:var(--bg-well);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .btn-side{ width:44px; height:44px; }
  .btn-side svg{ width:16px; height:16px; fill:var(--ink-muted); }
  .btn-play{
    width:60px; height:60px;
    background:var(--amber);
    border-color:var(--amber);
  }
  .btn-play svg{ width:20px; height:20px; fill:#fff; }

  .tracklist{
    margin-top:22px;
    display:flex;
    flex-direction:column;
  }
  .tracklist-heading{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    padding:0 4px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .pair-row{
    display:flex;
    align-items:stretch;
    gap:12px;
    padding:10px 4px 10px 8px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    background:none;
    border-left:none;
    border-right:3px solid var(--amber-dim);
    border-top:none;
    width:100%;
    text-align:right;
    font-family:inherit;
    color:inherit;
  }
  .pair-row:last-child{ border-bottom:none; }
  .pair-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.78rem;
    color:var(--ink-muted);
    width:20px;
    flex-shrink:0;
    padding-top:1px;
  }
  .pair-thumb{
    width:38px;
    height:38px;
    border-radius:8px;
    flex-shrink:0;
    overflow:hidden;
    background:linear-gradient(160deg,var(--rose),var(--teal));
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pair-thumb img{ width:100%; height:100%; object-fit:cover; }
  .pair-thumb svg{ width:18px; height:18px; fill:var(--ink); opacity:0.85; }
  .pair-info{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .pair-from{
    font-size:0.8rem;
    color:var(--rose);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pair-from b{ color:var(--ink); font-weight:600; }
  .pair-song{
    font-weight:500;
    font-size:0.94rem;
    color:var(--teal);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pair-row.active{ border-right-color:var(--amber); background:rgba(231,165,60,0.06); }
  .pair-row.active .pair-num{ color:var(--amber); }

  .example-flag[hidden]{ display:none; }
  .example-flag{
    display:inline-block;
    margin-top:18px;
    padding:8px 12px;
    border-radius:8px;
    background:rgba(231,165,60,0.12);
    border:1px solid rgba(231,165,60,0.35);
    color:var(--amber);
    font-size:0.78rem;
    text-align:center;
    width:100%;
  }
</style>
</head>
<body>

<div class="page" dir="rtl">
  <p class="eyebrow">מיקסטייפ מוקלט ביד</p>
  <h1>יום הולדת שמח, שירלי!</h1>

  <div class="deck">
    <div class="now-playing">
      <div class="now-art" id="art">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>
      </div>
      <div class="now-info">
        <p class="now-kind" id="kind">הקלטה</p>
        <p class="now-title" id="title">טוען…</p>
        <p class="now-sub" id="sub"></p>
      </div>
    </div>
    <p class="status-note" id="status"></p>

    <div class="counter-row">
      <span id="tCurrent">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      <span id="tTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="btn btn-side" id="prevBtn" aria-label="הקטע הקודם">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn" aria-label="נגן או עצור">
        <svg viewBox="0 0 24 24"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn btn-side" id="nextBtn" aria-label="הקטע הבא">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
    </div>

    <div class="tracklist">
      <p class="tracklist-heading">סדר ההשמעה</p>
      <div id="list"></div>
    </div>
  </div>

  <span class="example-flag" id="exampleFlag" hidden>הקבצים כאן הם עדיין דוגמה — יוחלפו בהקלטות ובשירים האמיתיים</span>

  <a href="./status.html" style="display:block;text-align:center;margin-top:22px;color:var(--ink-muted);font-size:.82rem;">מה חסר? →</a>
</div>

<audio id="audio"></audio>

<script>
/*
  הקבצים עצמם יושבים ברפו נפרד (Ido-Hadayo/Shirley-Birthday), בתיקיות
  audio/ ו-covers/, ונטענים כאן דרך raw.githubusercontent.com.
  הרשימה היא סדר ההשמעה המלא והמדויק ששלחה מעיין (68 שורות = 68 קבצים),
  בלי קיבוץ לזוגות — יש אנשים עם כמה תורות (למשל עמית, סימונה), ויש
  הקלטות בלי שם מיוחס עדיין (from: null, מסומנות בהערה למה).
  kind: "recording" (from: שם או null) או "song" (title/file/cover).
  file/cover הם שמות קבצים בתוך audio/ ו-covers/ בהתאמה (ריק = חסר).
*/
const RAW_BASE = "https://raw.githubusercontent.com/Ido-Hadayo/Shirley-Birthday/main/";
const audioUrl = f => f ? RAW_BASE + "audio/" + f : "";
const coverUrl = f => f ? RAW_BASE + "covers/" + f : "";

const rec = (from, note, file, cover) => ({ kind: "recording", from, note: note || "", file: file || "", cover: cover || "" });
const song = (title, file, cover) => ({ kind: "song", title, file: file || "", cover: cover || "" });

const ITEMS_RAW = [
  rec(null, "פתיחה — חלק 1", "rec-opening-1.m4a"),
  rec(null, "פתיחה — חלק 2", "rec-opening-2.m4a"),
  song("Puzzle Pieces — Saint Motel", "puzzle-pieces.mp3"),
  rec("סימונה", "לקראת Good Morning Baltimore", "rec-simona-1.m4a", "cover-simona-1.jpg"),
  song("Good Morning Baltimore — Hairspray (Nikki Blonsky)", "good-morning-baltimore.mp3"),
  rec(null, "הקדמה לפני \"שנקין\"", "rec-intro-sheinkin.m4a"),
  song("שנקין — מנגו", "sheinkin.mp3"),
  rec("עמית", "לקראת מנשה", "rec-amit-menashe.m4a", "cover-amit-1.jpg"),
  song("מנשה — מתוך \"החבדניקים\"", "menashe.mp3"),
  rec("מעיין", "", "rec-meayan.m4a", "cover-meayan.jpg"),
  song("I'll Be There for You — The Rembrandts", "ill-be-there-for-you.mp3"),
  rec(null, "\"אני: הקלטה מהעבודה, בהיסטוריה\" — של מי זה?", "rec-history-work.m4a"),
  rec(null, "הקדמה לפני \"מביאים את זה לאללה\"", "rec-intro-meviim.m4a"),
  song("מביאים את זה לאללה — מתוך \"הסוף\"", "mevi-im-et-ze-lealla.mp3"),
  song("Dog Days Are Over — Florence + the Machine", "dog-days-are-over.mp3"),
  rec("לי ים", "חלק 1", "rec-liyam-1.m4a", "cover-liyam.jpg"),
  rec("לי ים", "חלק 2", "rec-liyam-2.m4a", "cover-liyam.jpg"),
  song("Don't Stop Me Now — Queen", "dont-stop-me-now.mp3"),
  rec("דניאל", "", "rec-daniel.m4a", "cover-daniel.jpg"),
  song("וודו — מרסדס בנד", "vudu.mp3"),
  song("כל השבוע לך — החלונות הגבוהים", "kol-hashavua-lecha.mp3"),
  song("לזוז — הדג נחש", "lazuz.mp3"),
  rec("משה", "", "rec-moshe.m4a", "cover-moshe.jpg"),
  song("Defying Gravity — Wicked (2024, Cynthia Erivo)", "defying-gravity.mp3"),
  rec("גל", "", "rec-gal.m4a"),
  song("You'll Be Back — Hamilton", "youll-be-back.mp3"),
  rec("יויו", "", "rec-yoyo.m4a", "cover-yoyo.jpg"),
  song("Liang", "liang.mp3"),
  rec("אבא של שירלי", "", "rec-shirlys-dad.m4a", "cover-shirlys-dad.jpg"),
  song("Barbie Girl", "barbie-girl.mp3"),
  rec("עמית", "לקראת טיפת אמת", "rec-amit-tipat-emet.m4a", "cover-amit-2.jpg"),
  song("טיפת אמת", "tipat-emet.mp3"),
  rec(null, "הקדמה לפני Top of the World", "rec-intro-top-of-the-world.m4a", "cover-intro-top-of-the-world.jpg"),
  song("Top of the World — The Carpenters", "top-of-the-world.mp3"),
  rec("דרור", "", "rec-dror.m4a", "cover-dror.jpg"),
  song("עבד כי ימלוך", "eved-ki-yimloch.mp3"),
  rec("תמר", "", "rec-tamar.m4a", "cover-tamar.jpg"),
  song("Hopelessly Devoted to You — Olivia Newton-John", "hopelessly-devoted.mp3"),
  rec("גבי", "", "rec-gabi.m4a", "cover-yuval-gabi.jpg"),
  song("חביב גלבי", "habib-galbi.mp3"),
  rec("נוי", "", "rec-noy.m4a"),
  song("False Confidence — Noah Kahan", "false-confidence.mp3"),
  rec("קרן", "חלק 1", "rec-keren-1.m4a", "cover-keren.jpg"),
  rec("קרן", "חלק 2", "rec-keren-2.m4a", "cover-keren.jpg"),
  song("Isn't She Lovely — Glee", "isnt-she-lovely.mp3"),
  rec("מוניס", "", "rec-monis.m4a"),
  song("עבריין — ליילי", "avaryan.mp3"),
  rec(null, "הקדמה לפני Man or a Muppet", "rec-intro-man-or-muppet.m4a", "cover-intro-man-or-muppet.jpg"),
  song("Man or a Muppet — The Muppets (2011)", "man-or-muppet.mp3"),
  rec("יובל", "", "rec-yuval.m4a", "cover-yuval-gabi.jpg"),
  song("It Starts With Sorry", "it-starts-with-sorry.mp3"),
  rec("צור", "חלק 1", "rec-tzur-1.m4a"),
  rec("צור", "חלק 2", "rec-tzur-2.m4a"),
  song("Take Me Home, Country Roads — John Denver", "country-roads.mp3"),
  rec("נעמה", "", "rec-naama.m4a", "cover-naama.jpg"),
  rec("עמית", "לקראת שיר לנטע", "rec-amit-shir-lenatta.m4a", "cover-amit-3.jpg"),
  song("שיר לנטע", "shir-lenatta.mp3"),
  rec("סימונה", "ברכה 2, לקראת Forever Young", "rec-simona-2.m4a"),
  song("Forever Young — Alphaville", "forever-young.mp3"),
  rec("סימונה", "ברכה אחרונה", "rec-simona-last.m4a", "cover-simona-last.jpg"),
  song("You're My Best Friend — Queen", "best-friend.mp3"),
  song("In My Life — The Beatles", "in-my-life.mp3"),
  rec(null, "הקדמה ל-Avenue Q — חלק 1", "rec-avenueq-1.m4a", "cover-avenueq.jpg"),
  rec(null, "הקדמה ל-Avenue Q — חלק 2", "rec-avenueq-2.m4a", "cover-avenueq.jpg"),
  song("What Do You Do with a B.A. in English? — Avenue Q", "ba-in-english.mp3"),
  rec("עמית", "לקראת איך לאכול אותך", "rec-amit-eich-leechol-otach.m4a", "cover-amit-4.jpg"),
  song("איך לאכול אותך", "eich-leechol-otach.mp3"),
  rec(null, "הקדמה לפני City of Stars", "rec-intro-city-of-stars.m4a"),
  rec(null, "ברכת סיום", "rec-closing.m4a", "cover-closing.jpg"),
  song("City of Stars — La La Land", "city-of-stars.mp3"),
  song("Sunny — Boney M.", "sunny.mp3"),
];

const ITEMS = ITEMS_RAW.map(it => ({ ...it, src: audioUrl(it.file), cover: coverUrl(it.cover) }));
const PLAYLIST = ITEMS;

const hasRealFiles = ITEMS.some(it => it.src);
document.getElementById("exampleFlag").hidden = hasRealFiles;

const audio = document.getElementById("audio");
const art = document.getElementById("art");
const kindEl = document.getElementById("kind");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const seek = document.getElementById("seek");
const tCurrent = document.getElementById("tCurrent");
const tTotal = document.getElementById("tTotal");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const listEl = document.getElementById("list");

const ICON_MIC = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 12z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3z"/></svg>';

let current = 0;
let isSeeking = false;

function fmt(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function renderList(){
  listEl.innerHTML = "";
  ITEMS.forEach((it, i) => {
    const row = document.createElement("button");
    row.className = "pair-row" + (i === current ? " active" : "");
    const thumb = it.cover ? `<img src="${it.cover}" alt="">` : (it.kind === "song" ? ICON_NOTE : ICON_MIC);
    const label = it.kind === "recording"
      ? `<span class="pair-from">🎙️ ${it.from ? `הקדשה מאת <b>${it.from}</b>` : "הקדמה"}${it.note ? ` <span style="opacity:.6">· ${it.note}</span>` : ""}</span>`
      : `<span class="pair-song">🎵 ${it.title || "טרם נקבע"}</span>`;
    row.innerHTML = `
      <span class="pair-num">${String(i+1).padStart(2,"0")}</span>
      <span class="pair-thumb">${thumb}</span>
      <span class="pair-info">${label}</span>`;
    row.addEventListener("click", () => loadTrack(i, true));
    listEl.appendChild(row);
  });
}

function nearestFrom(i){
  for(let j = i; j >= 0; j--){
    if(ITEMS[j].kind === "recording" && ITEMS[j].from) return ITEMS[j].from;
  }
  return null;
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= PLAYLIST.length) return;
  current = i;
  const t = PLAYLIST[i];
  statusEl.textContent = "";
  audio.src = t.src || "";

  if(t.kind === "recording"){
    kindEl.textContent = "הקלטה";
    kindEl.className = "now-kind rec";
    titleEl.textContent = t.from ? `הקדשה מאת ${t.from}` : "הקדמה";
    subEl.textContent = t.note || "";
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_MIC;
  } else {
    const from = nearestFrom(i);
    kindEl.textContent = "שיר";
    kindEl.className = "now-kind song";
    titleEl.textContent = t.title || "השיר טרם נבחר";
    subEl.textContent = from ? `מוקדש ע"י ${from}` : "";
    art.innerHTML = t.cover ? `<img src="${t.cover}" alt="">` : ICON_NOTE;
  }

  renderList();
  if(autoplay){
    if(!t.src){
      statusEl.textContent = "מדלג — הקובץ הזה עוד לא הועלה";
      loadTrack(i + 1, true);
      return;
    }
    audio.play().catch(()=>{});
  }
}

playBtn.addEventListener("click", () => {
  if(!audio.src){ loadTrack(current + 1, true); return; }
  if(audio.paused){ audio.play().catch(()=>{}); }
  else { audio.pause(); }
});

prevBtn.addEventListener("click", () => loadTrack(current - 1, true));
nextBtn.addEventListener("click", () => loadTrack(current + 1, true));

audio.addEventListener("play", () => document.getElementById("playIcon").setAttribute("d", "M6 5h4v14H6zm8 0h4v14h-4z"));
audio.addEventListener("pause", () => document.getElementById("playIcon").setAttribute("d", "M8 5v14l11-7z"));

audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration || 0;
  tTotal.textContent = fmt(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  if(isSeeking) return;
  seek.value = audio.currentTime;
  tCurrent.textContent = fmt(audio.currentTime);
});

seek.addEventListener("input", () => { isSeeking = true; });
seek.addEventListener("change", () => {
  if(audio.src) audio.currentTime = parseFloat(seek.value);
  isSeeking = false;
});

audio.addEventListener("ended", () => {
  if(current < PLAYLIST.length - 1) loadTrack(current + 1, true);
});

audio.addEventListener("error", () => {
  if(audio.src) statusEl.textContent = "לא הצלחתי לטעון את הקובץ הזה";
});

loadTrack(0, false);
</script>
</body>
</html>
