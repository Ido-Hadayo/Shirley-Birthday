<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סטטוס המיקסטייפ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --card:#FFFFFF; --ink:#2A2118; --ink-muted:#8A7B6B;
    --ok:#238C82; --missing:#C4436A; --line:rgba(42,33,24,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:"Heebo","Segoe UI",Arial,sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:28px 16px 64px;
  }
  .page{ width:100%; max-width:520px; direction:rtl; }
  h1{ text-align:center; font-size:1.5rem; margin:0 0 4px; }
  .summary{ text-align:center; color:var(--ink-muted); font-size:.95rem; margin:0 0 24px; }
  .summary b{ color:var(--ok); }
  .bar{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:0 0 26px; }
  .bar-fill{ height:100%; background:var(--ok); }
  .row{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--line); font-size:.92rem;
  }
  .row:last-child{ border-bottom:none; }
  .num{ font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-muted); width:22px; flex-shrink:0; }
  .mark{ width:20px; flex-shrink:0; text-align:center; }
  .mark.ok{ color:var(--ok); }
  .mark.missing{ color:var(--missing); }
  .label{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .label .tag{ color:var(--ink-muted); font-size:.78rem; }
  .back{ display:block; text-align:center; margin-top:26px; color:var(--ink-muted); font-size:.82rem; }
</style>
</head>
<body>
<div class="page">
  <h1>סטטוס המיקסטייפ</h1>
  <p class="summary" id="summary"></p>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div id="list"></div>
  <a class="back" href="./index.html">← לאתר עצמו</a>
</div>

<script>

  rec(null, "הקדמה ל-Avenue Q — חלק 2", "rec-avenueq-2.m4a"),

  rec(null, "ברכת סיום", "rec-closing.m4a"),
  song("City of Stars — La La Land", "city-of-stars.mp3"),
  song("Sunny — Boney M.", "sunny.mp3"),

const listEl = document.getElementById("list");
const done = ITEMS_RAW.filter(it => it.file).length;
const total = ITEMS_RAW.length;
document.getElementById("summary").innerHTML = `<b>${done}</b> מתוך ${total} קבצים יש · חסרים ${total - done}`;
document.getElementById("barFill").style.width = (done / total * 100).toFixed(0) + "%";

ITEMS_RAW.forEach((it, i) => {
  const row = document.createElement("div");
  row.className = "row";
  const has = !!it.file;
  const labelText = it.kind === "recording"
    ? (it.from ? `🎙️ הקדשה מאת ${it.from}` : `🎙️ הקדמה`) + (it.note ? ` <span class="tag">· ${it.note}</span>` : "")
    : `🎵 ${it.title || "טרם נבחר"}`;
  row.innerHTML = `
    <span class="num">${String(i+1).padStart(2,"0")}</span>
    <span class="mark ${has ? "ok" : "missing"}">${has ? "✓" : "✗"}</span>
    <span class="label">${labelText}</span>`;
  listEl.appendChild(row);
});
</script>
</body>
</html>
